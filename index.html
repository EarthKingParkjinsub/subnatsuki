<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Moments</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <header class="header">
            <h1>Our Moments ❤️</h1>
        </header>


        <section class="gallery">

            <button class="photo-card">
                <img src="images/cat.jpg" alt="사진 1">
            </button>

            <button class="photo-card">
                <img src="images/basesub.jpg" alt="사진 2">
            </button>

            <button class="photo-card">
                <img src="images/bbuuu.png" alt="사진 3">
            </button>

            <button class="photo-card">
                <img src="images/cutetuski.jpg" alt="사진 4">
            </button>

            <button class="photo-card">
                <img src="images/glass.jpg" alt="사진 5">
            </button>

            <button class="photo-card">
                <img src="images/insangnecut.jpg" alt="사진 6">
            </button>

            <button class="photo-card">
                <img src="images/sinhodang.jpg" alt="사진 7">
            </button>

        </section>


        <div class="heart-control">

            <div id="heartMessage" class="heart-message">
                츠키야 사랑해 !
            </div>

            <button id="heartButton" class="heart-button" type="button">
                ❤️
            </button>

        </div>

    </main>


    <!-- 이미지 뷰어 -->

    <div id="lightbox" class="lightbox">

        <button id="closeLightbox" class="close-lightbox">
            ✕
        </button>



        <div id="lightboxArea" class="lightbox-area">

            <img id="lightboxImage" src="" alt="확대 사진" draggable="false">

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
