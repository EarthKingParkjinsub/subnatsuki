<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Moments</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <header class="header">
            <h1>sub ❤️ tsuki</h1>
            <p>사진을 눌러보세요</p>
        </header>


        <!-- 메인 사진 -->
        <section id="mainSection" class="main-section">

            <div class="main-photo-wrapper">

                <img id="mainPhoto" src="images/cat.jpg" alt="메인 사진">

                <div class="zoom-guide">
                    클릭해서 크게 보기
                </div>

            </div>

            <button id="heartButton" class="heart-button" type="button" aria-label="하트 뿌리기">
                ❤️
            </button>

        </section>


        <!-- 갤러리 -->
        <section class="gallery">

            <button class="photo-card active" type="button">
                <img src="images/cat.jpg" alt="사진 1">
            </button>


            <button class="photo-card" type="button">
                <img src="images/basesub.jpg" alt="사진 2">
            </button>


            <button class="photo-card" type="button">
                <img src="images/bbuuu.png" alt="사진 3">
            </button>


            <button class="photo-card" type="button">
                <img src="images/cutetuski.jpg" alt="사진 4">
            </button>


            <button class="photo-card" type="button">
                <img src="images/glass.jpg" alt="사진 5">
            </button>


            <button class="photo-card" type="button">
                <img src="images/insangnecut.jpg" alt="사진 6">
            </button>


            <button class="photo-card" type="button">
                <img src="images/sinhodang.jpg" alt="사진 7">
            </button>

        </section>

    </main>


    <!-- ======================
         전체화면 이미지 뷰어
    ======================= -->

    <div id="lightbox" class="lightbox" aria-hidden="true">

        <button id="closeLightbox" class="close-lightbox" type="button" aria-label="사진 닫기">
            ✕
        </button>


        <div class="viewer-info">
            마우스 휠: 확대 · 드래그: 이동 · 더블클릭: 초기화
        </div>


        <div id="lightboxArea" class="lightbox-area">

            <img id="lightboxImage" src="" alt="확대된 사진" draggable="false">

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
